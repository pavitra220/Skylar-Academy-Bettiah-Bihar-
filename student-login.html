<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login | Skylar Academy</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#000,#111,#1a1a1a);

overflow:hidden;

}

.login-box{

width:400px;

padding:40px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border-radius:20px;

box-shadow:0 0 25px rgba(255,136,0,.3);

text-align:center;

color:white;

}

.login-box h1{

color:#ff8800;

margin-bottom:25px;

}

.login-box i{

font-size:70px;

color:#ff8800;

margin-bottom:20px;

}

input{

width:100%;

padding:15px;

margin:10px 0;

border:none;

outline:none;

background:#111;

color:white;

border-radius:10px;

}

button{

width:100%;

padding:15px;

background:#ff8800;

border:none;

border-radius:30px;

color:white;

font-size:18px;

cursor:pointer;

transition:.4s;

margin-top:15px;

}

button:hover{

box-shadow:0 0 20px orange;

transform:translateY(-3px);

}

#error{

margin-top:15px;

color:red;

font-size:15px;

}

</style>

</head>

<body>

<div class="login-box">

<i class="fa-solid fa-user-graduate"></i>

<h1>Student Login</h1>

<input type="text" id="username" placeholder="Student ID">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">

Login

</button>

<p id="error"></p>

</div>

<script>

function login(){

let user=document.getElementById("username").value;

let pass=document.getElementById("password").value;

// Demo Login
if(user==="student" && pass==="12345"){

window.location="student-dashboard.html";

}else{

document.getElementById("error").innerHTML="Invalid Student ID or Password";

}

}

</script>

</body>

</html>
