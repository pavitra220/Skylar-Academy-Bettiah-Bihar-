<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{

margin:0;

font-family:Poppins,sans-serif;

background:#090909;

color:white;

}

header{

background:#111;

padding:20px;

text-align:center;

color:#ff8800;

font-size:30px;

font-weight:bold;

}

.container{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:25px;

padding:40px;

}

.card{

background:rgba(255,255,255,.08);

padding:30px;

border-radius:20px;

text-align:center;

transition:.4s;

}

.card:hover{

transform:translateY(-8px);

box-shadow:0 0 20px orange;

}

.card i{

font-size:45px;

color:#ff8800;

margin-bottom:20px;

}

.card h2{

margin-bottom:15px;

}

.logout{

display:inline-block;

margin:30px;

padding:15px 30px;

background:#ff8800;

color:white;

text-decoration:none;

border-radius:30px;

}

</style>

</head>

<body>

<header>

🎓 Skylar Academy Student Dashboard

</header>

<div class="container">

<div class="card">

<i class="fa-solid fa-user"></i>

<h2>Profile</h2>

<p>Name: Demo Student</p>

</div>

<div class="card">

<i class="fa-solid fa-calendar-check"></i>

<h2>Attendance</h2>

<p>96%</p>

</div>

<div class="card">

<i class="fa-solid fa-chart-line"></i>

<h2>Results</h2>

<p>A Grade</p>

</div>

<div class="card">

<i class="fa-solid fa-book"></i>

<h2>Assignments</h2>

<p>5 Pending</p>

</div>

</div>

<center>

<a href="student-login.html" class="logout">

Logout

</a>

</center>

</body>
</html>
