<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | Skylar Academy</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

<style>

body{
background:#050505;
color:#fff;
}

.gallery-section{
padding:120px 8% 80px;
}

.gallery-section h1{
text-align:center;
font-size:50px;
color:#ff8800;
margin-bottom:15px;
}

.gallery-section p{
text-align:center;
color:#ccc;
margin-bottom:50px;
}

.gallery-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

gap:25px;

}

.gallery-item{

overflow:hidden;

border-radius:20px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

transition:.4s;

cursor:pointer;

}

.gallery-item:hover{

transform:translateY(-10px);

box-shadow:0 0 25px orange;

}

.gallery-item img{

width:100%;

height:260px;

object-fit:cover;

transition:.5s;

}

.gallery-item:hover img{

transform:scale(1.1);

}

.lightbox{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.9);

display:none;

justify-content:center;

align-items:center;

z-index:9999;

}

.lightbox img{

max-width:90%;

max-height:90%;

border-radius:20px;

}

.close{

position:absolute;

top:20px;

right:35px;

font-size:45px;

color:white;

cursor:pointer;

}

</style>

</head>

<body>

<header>

<nav>

<div class="logo">

<i class="fa-solid fa-graduation-cap"></i>

Skylar Academy

</div>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="teachers.html">Teachers</a></li>

<li><a href="results.html">Results</a></li>

<li><a href="admission.html">Admission</a></li>

<li><a href="contact.html">Contact</a></li>

</ul>

</nav>

</header>

<section class="gallery-section">

<h1 data-aos="zoom-in">Our Gallery</h1>

<p data-aos="fade-up">

Campus • Smart Classes • Events • Toppers

</p>

<div class="gallery-grid">

<div class="gallery-item" data-aos="fade-up">
<img src="https://i.postimg.cc/R02ZyDsz/IMG-20260717-WA0010.jpg" onclick="openImg(this.src)">
</div>

<div class="gallery-item" data-aos="fade-up">
<img src="https://i.postimg.cc/mDMgsyJy/1784303859673.png" data-aos="fade-up">
<img src="https://i.postimg.cc/CLtCXDkN/IMG-20260717-WA0008.jpg" onclick="openImg(this.src)">
</div>

<div class="gallery-item" data-aos="fade-up">
<img src="https://i.postimg.cc/zvrXXRYS/1784299260676.png" onclick="openImg(this.src)">
</div>

</div>

</section>

<div class="lightbox" id="lightbox">

<span class="close" onclick="closeImg()">&times;</span>

<img id="preview">

</div>

<script>

function openImg(src){

document.getElementById("lightbox").style.display="flex";

document.getElementById("preview").src=src;

}

function closeImg(){

document.getElementById("lightbox").style.display="none";

}

</script>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script>

AOS.init({

duration:1000,

once:true

});

</script>

</body>

</html>
