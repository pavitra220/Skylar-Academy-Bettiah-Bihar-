<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skylar Academy Admin Panel</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#090909;
color:#fff;
}

.login{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{

width:380px;

background:#111;

padding:40px;

border-radius:20px;

text-align:center;

box-shadow:0 0 25px orange;

}

.box h1{

color:orange;

margin-bottom:20px;

}

input{

width:100%;

padding:15px;

margin:10px 0;

background:#222;

border:none;

border-radius:10px;

color:white;

}

button{

width:100%;

padding:15px;

background:orange;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

}

.dashboard{

display:none;

}

header{

background:#111;

padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

}

header h2{

color:orange;

}

.logout{

background:red;

padding:10px 20px;

border-radius:25px;

color:white;

text-decoration:none;

}

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:25px;

padding:40px;

}

.card{

background:#111;

padding:30px;

border-radius:20px;

text-align:center;

transition:.4s;

}

.card:hover{

transform:translateY(-8px);

box-shadow:0 0 20px orange;

}

.card i{

font-size:50px;

color:orange;

margin-bottom:15px;

}

</style>

</head>

<body>

<div class="login" id="loginPage">

<div class="box">

<h1>Admin Login</h1>

<input type="text" id="admin">

<input type="password" id="pass">

<button onclick="login()">Login</button>

<p id="msg"></p>

</div>

</div>

<div class="dashboard" id="dashboard">

<header>

<h2>Skylar Academy Admin Panel</h2>

<a href="#" onclick="logout()" class="logout">

Logout

</a>

</header>

<div class="cards">

<div class="card">

<i class="fa-solid fa-users"></i>

<h2>Students</h2>

<p>1000+</p>

</div>

<div class="card">

<i class="fa-solid fa-user-tie"></i>

<h2>Teachers</h2>

<p>20</p>

</div>

<div class="card">

<i class="fa-solid fa-image"></i>

<h2>Gallery</h2>

<p>Manage Photos</p>

</div>

<div class="card">

<i class="fa-solid fa-file"></i>

<h2>Admissions</h2>

<p>View Forms</p>

</div>

<div class="card">

<i class="fa-solid fa-chart-column"></i>

<h2>Results</h2>

<p>Update Results</p>

</div>

<div class="card">

<i class="fa-solid fa-gear"></i>

<h2>Settings</h2>

<p>Website Control</p>

</div>

</div>

</div>

<script>

function login(){

let id=document.getElementById("admin").value;

let pass=document.getElementById("pass").value;

if(id=="Kaushal Singh" && pass=="Kaushal@220"){

document.getElementById("loginPage").style.display="none";

document.getElementById("dashboard").style.display="block";

}

else{

document.getElementById("msg").innerHTML="Wrong ID or Password";

}

}

function logout(){

location.reload();

}

</script>

</body>

</html>
