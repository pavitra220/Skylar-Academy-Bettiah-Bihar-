<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Skylar Academy</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

<style>

body{
background:#080808;
color:white;
font-family:Poppins,sans-serif;
}

.contact{
padding:120px 8% 80px;
}

.contact h1{
text-align:center;
font-size:50px;
color:#ff8800;
margin-bottom:15px;
}

.contact p{
text-align:center;
margin-bottom:50px;
color:#ddd;
}

.contact-box{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(320px,1fr));

gap:30px;

}

.card{

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

padding:30px;

border-radius:20px;

transition:.4s;

}

.card:hover{

transform:translateY(-10px);

box-shadow:0 0 25px orange;

}

.card h2{

color:#ff8800;

margin-bottom:20px;

}

.card p{

margin:15px 0;

}

.card i{

color:#ff8800;

margin-right:10px;

}

.btn{

display:inline-block;

padding:12px 25px;

background:#ff8800;

color:white;

text-decoration:none;

border-radius:30px;

margin-top:20px;

transition:.4s;

}

.btn:hover{

box-shadow:0 0 20px orange;

}

iframe{

width:100%;

height:350px;

border:none;

border-radius:20px;

}

.social{

margin-top:20px;

}

.social a{

display:inline-block;

width:45px;

height:45px;

line-height:45px;

text-align:center;

background:#ff8800;

color:white;

border-radius:50%;

margin-right:10px;

transition:.4s;

}

.social a:hover{

transform:scale(1.1);

}

</style>

</head>

<body>

<header>

<nav>

<div class="logo">

<i class="fa-solid fa-graduation-cap"></i>

Skylar Academy

</div>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="teachers.html">Teachers</a></li>

<li><a href="gallery.html">Gallery</a></li>

<li><a href="results.html">Results</a></li>

<li><a href="admission.html">Admission</a></li>

</ul>

</nav>

</header>

<section class="contact">

<h1 data-aos="zoom-in">Contact Us</h1>

<p data-aos="fade-up">
We'd love to hear from you.
</p>

<div class="contact-box">

<div class="card" data-aos="fade-right">

<h2>Get In Touch</h2>

<p><i class="fa-solid fa-location-dot"></i> Bettiah, Bihar</p>

<p><i class="fa-solid fa-phone"></i> +91 9153803347</p>

<p><i class="fa-solid fa-envelope"></i> info@skylaracademy.com</p>

<a href="tel:+919153803347" class="btn">Call Now</a>

<a href="https://wa.me/919153803347" class="btn">WhatsApp</a>

<div class="social">

<a href="#"><i class="fab fa-facebook-f"></i></a>

<a href="#"><i class="fab fa-instagram"></i></a>

<a href="#"><i class="fab fa-youtube"></i></a>

<a href="#"><i class="fab fa-linkedin-in"></i></a>

</div>

</div>

<div class="card" data-aos="fade-left">

<iframe
src="https://www.google.com/maps?q=Bettiah,Bihar&output=embed">
</iframe>

</div>

</div>

</section>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script>

AOS.init({
duration:1000,
once:true
});

</script>

</body>

</html>
